<!DOCTYPE html>
<html lang="fr">
<head>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <title>Mon Ménage Étudiant</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4 text-primary">🏠 Tableau de bord du Ménage</h2>
        <div class="card shadow">
            <div class="card-body">
                <table class="table table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>Tâche</th>
                            <th>Assigné à</th>
                            <th>Statut</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for tache in taches %}
                        <tr>
                            <td><strong>{{ tache.titre }}</strong></td>
                            <td>{{ tache.assigne_a.prenom }}</td>
                            <td>
                                {% if tache.est_terminee %}
                                    <span class="badge bg-success">Terminé</span>
                                {% else %}
                                    <span class="badge bg-warning text-dark">En cours</span>
                                {% endif %}
                            </td>
                        </tr>
                        {% empty %}
                        <tr><td colspan="3" class="text-center">Aucune tâche enregistrée.</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
